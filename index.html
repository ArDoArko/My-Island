<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My Island 0.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071b2a;color:#fff;font-family:system-ui,Arial;overflow:hidden}.top{position:fixed;z-index:4;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.pill{background:#102b3ccc;border:1px solid #ffffff35;padding:8px 12px;border-radius:20px;font-weight:800;backdrop-filter:blur(6px)}canvas{display:block;width:100vw;height:100vh;background:#1699c7}.quest{position:fixed;z-index:4;left:12px;top:70px;max-width:280px;background:#102b3cdd;padding:12px 14px;border-radius:14px;border:1px solid #ffffff30}.quest b{color:#ffd34e}.controls{position:fixed;z-index:5;bottom:18px;left:18px;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:5px}.controls button,.action{border:0;border-radius:16px;background:#ffffffd9;font-size:25px;font-weight:900;color:#123;box-shadow:0 4px 10px #0005}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.action{position:fixed;z-index:5;right:22px;bottom:28px;width:86px;height:86px;border-radius:50%;font-size:16px;background:#ffd34e}.msg{position:fixed;z-index:6;left:50%;bottom:120px;transform:translateX(-50%);background:#071b2add;padding:10px 16px;border-radius:14px;opacity:0;transition:.2s}.msg.show{opacity:1}.start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#117fa9,#65cfe1)}.card{text-align:center;background:#082a3dd9;padding:32px;border-radius:28px;box-shadow:0 20px 50px #0006}.card h1{font-size:46px;margin:0}.card p{opacity:.85}.card button{padding:14px 34px;border:0;border-radius:22px;font-size:20px;font-weight:900;background:#ffd34e;color:#123}
</style></head><body>
<div id="start" class="start"><div class="card"><div style="font-size:70px">🏝️</div><h1>MY ISLAND</h1><p>0.1 • Twoja przygoda zaczyna się tutaj</p><button onclick="startGame()">GRAJ</button></div></div>
<div class="top"><div class="pill">❤️ <span id="energy">100</span></div><div class="pill">⭐ XP <span id="xp">0</span></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🪵 <span id="wood">0</span></div><div class="pill">🪨 <span id="stone">0</span></div></div>
<div class="quest">📜 <b>Pierwsza misja</b><br>Zbierz 5 drewna i 3 kamienie.<br><span id="progress">Drewno 0/5 • Kamień 0/3</span></div>
<canvas id="game"></canvas><div id="msg" class="msg"></div>
<div class="controls"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div><button class="action" onclick="collect()">ZBIERZ</button>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,playing=false,keys={},p={x:0,y:0},wood=0,stone=0,xp=0,coins=0,done=false;
const objs=[];function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;if(!p.x){p.x=W/2;p.y=H/2}}addEventListener('resize',resize);resize();
function seed(){objs.length=0;for(let i=0;i<12;i++)objs.push({t:'tree',x:W*.2+Math.random()*W*.6,y:H*.2+Math.random()*H*.6,alive:1});for(let i=0;i<8;i++)objs.push({t:'rock',x:W*.2+Math.random()*W*.6,y:H*.2+Math.random()*H*.6,alive:1})}seed();
function island(){x.clearRect(0,0,W,H);x.fillStyle='#159cc5';x.fillRect(0,0,W,H);x.beginPath();x.ellipse(W/2,H/2,W*.39,H*.36,0,0,Math.PI*2);x.fillStyle='#f5d887';x.fill();x.beginPath();x.ellipse(W/2,H/2,W*.34,H*.31,0,0,Math.PI*2);x.fillStyle='#61b85a';x.fill();for(const o of objs)if(o.alive){x.font=o.t==='tree'?'42px serif':'30px serif';x.fillText(o.t==='tree'?'🌴':'🪨',o.x-18,o.y+15)}x.font='38px serif';x.fillText('🧑',p.x-18,p.y+15)}
function loop(){if(playing){let s=3.2;if(keys.ArrowUp||keys.w)p.y-=s;if(keys.ArrowDown||keys.s)p.y+=s;if(keys.ArrowLeft||keys.a)p.x-=s;if(keys.ArrowRight||keys.d)p.x+=s;p.x=Math.max(W*.17,Math.min(W*.83,p.x));p.y=Math.max(H*.16,Math.min(H*.84,p.y));island()}requestAnimationFrame(loop)}loop();
addEventListener('keydown',e=>keys[e.key]=1);addEventListener('keyup',e=>keys[e.key]=0);document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=()=>keys[k]=0});
function startGame(){document.getElementById('start').style.display='none';playing=true;load();island()}
function collect(){let best=null,d=65;for(const o of objs)if(o.alive){let q=Math.hypot(p.x-o.x,p.y-o.y);if(q<d){d=q;best=o}}if(!best)return say('Podejdź bliżej do drzewa lub kamienia 🙂');best.alive=0;if(best.t==='tree')wood++;else stone++;xp+=10;coins+=2;update();save();if(wood>=5&&stone>=3&&!done){done=true;xp+=100;coins+=50;say('🎉 Misja wykonana! +100 XP i +50 monet');update();save()}else say(best.t==='tree'?'🪵 Zdobyto drewno!':'🪨 Zdobyto kamień!')}
function update(){woodEl.textContent=wood;stoneEl.textContent=stone;xpEl.textContent=xp;coinsEl.textContent=coins;progress.textContent=`Drewno ${wood}/5 • Kamień ${stone}/3`}
const woodEl=document.getElementById('wood'),stoneEl=document.getElementById('stone'),xpEl=document.getElementById('xp'),coinsEl=document.getElementById('coins');function say(t){msg.textContent=t;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),1800)}
function save(){localStorage.setItem('myIsland01',JSON.stringify({wood,stone,xp,coins,done}))}function load(){try{let d=JSON.parse(localStorage.getItem('myIsland01'));if(d){wood=d.wood||0;stone=d.stone||0;xp=d.xp||0;coins=d.coins||0;done=!!d.done;update()}}catch(e){}}
</script></body></html>
